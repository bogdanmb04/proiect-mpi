services:
  # database
  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-network

  # server
  backend:
      image: forum-back-prod
      build:
        context: ./Backend/ForumAPI/ForumAPI
        dockerfile: Dockerfile
      ports:
        - "7151:8080"
      container_name: forum-back-container
      depends_on:
        - database
      environment:
        ConnectionStrings__ForumContext: ${ConnectionStrings__ForumContext}
        JWTSettings__SecretKey: ${JWTSettings__SecretKey}
      networks:
        - forum-network

  # client
  frontend:
    image: forum-front-prod
    build:
      context: ./Frontend/forumClient
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    container_name: forum-front-container
    
  # nginx:
  #   image: nginx:latest
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:z
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - frontend
  #     - backend

networks:
  forum-network:
    driver: bridge

volumes:
  database-data: